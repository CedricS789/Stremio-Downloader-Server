name: my-media-dock

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nuviflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-media-dock:latest
    container_name: my-media-dock
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:60500:60500"
    environment:
      HOST: "0.0.0.0"
      PORT: "60500"
      BASE_URL: http://127.0.0.1:60500
      ADDON_NAME: "My-Media-Dock"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "${NUVI_ADMIN_PASSWORD:?Run scripts/Initialize.ps1 first}"
      SESSION_SECRET: "${NUVI_SESSION_SECRET:?Run scripts/Initialize.ps1 first}"
      STREAM_SECRET: "${NUVI_STREAM_SECRET:?Run scripts/Initialize.ps1 first}"
      DATABASE_PATH: /app/data/media.db
      MOVIES_PATH: /media/movies
      TV_PATH: /media/tv
      SCAN_INTERVAL_MINUTES: "5"
      WATCH_MEDIA: "true"
      SCAN_ON_STARTUP: "true"
      SILO_ENABLED: "false"
      FALLBACK_ADDON_ENABLED: "false"
      AIOSTREAMS_BASE_URL: "${AIOSTREAMS_BASE_URL:-}"
    volumes:
      - nuvi_config:/app/data
      - "${MEDIA_ROOT:?Run scripts/Initialize.ps1 first}/media/movies:/media/movies"
      - "${MEDIA_ROOT:?Run scripts/Initialize.ps1 first}/media/tv:/media/tv"
    logging: *logging

volumes:
  nuvi_config:
    external: true
    name: stremio-automation_nuvi_config
